name: Synthetic tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: lab-v2-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build isolated Windows fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet --info
          dotnet build tools/SyntheticTaskApp/SyntheticTaskApp.csproj -c Release --nologo
          dotnet build tools/SyntheticWpfTaskApp/SyntheticWpfTaskApp.csproj -c Release --nologo
          dotnet build tools/WindowsObserver/WindowsObserver.csproj -c Release --nologo
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Parse Windows laboratory scripts without collection
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem src/observador/*.ps1, tools/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw 'Laboratory script syntax error' }
          }
